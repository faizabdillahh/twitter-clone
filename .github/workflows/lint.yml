name: linter

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      - name: Install Dependencies
        run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

      # Pint dijalankan dalam mode uji supaya CI gagal, bukan mengubah berkas.
      - name: Run Pint
        run: vendor/bin/pint --test

      # Aturan komentar per baris tidak bisa diperiksa Pint, jadi diperiksa di sini.
      - name: Check Comment Coverage
        run: php scripts/cek-komentar.php
